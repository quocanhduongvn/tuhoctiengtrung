<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#dc2626">
  <title>Đang Ngoại Tuyến - Tự Học Tiếng Trung</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #090d16;
      color: #f8fafc;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background-color: #131b2e;
      border: 1px solid #1e293b;
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-block;
      width: 64px;
      height: 64px;
      line-height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, #b91c1c, #ef4444);
      color: white;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 8px 0;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
      margin: 0 0 20px 0;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px 0;
      border-radius: 14px;
      background-color: #dc2626;
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">学</div>
    <h1>Bạn Đang Ngoại Tuyến</h1>
    <p>Không có kết nối mạng internet. Bạn vẫn có thể mở lại trang chính để ôn tập từ vựng, flashcard và 88 mẫu câu đã lưu trên thiết bị!</p>
    <button class="btn" onclick="window.location.href='./index.html'">Quay Lại Trang Ôn Tập</button>
  </div>
</body>
</html>
